[package]
name = "zydeco-abi"
# Explicit metadata keeps this crate usable in standalone runtime bundles
# without requiring workspace package inheritance.
version = "0.3.0"
rust-version = "1.97"
edition = "2024"
license = "MIT"
description = "Shared builtin, FFI, and host contracts across Zydeco frontend, backends, and runtime"

[features]
default = []
bundle = []
std = []
serde = ["dep:serde"]

[dependencies]
zydeco-machine = { workspace = true }
serde = { workspace = true, optional = true }

[lib]
doctest = false

[lints.clippy]
debug_assert_with_mut_call = "warn"
# Function-length budget; the threshold lives in `clippy.toml`.
too_many_lines = "warn"
