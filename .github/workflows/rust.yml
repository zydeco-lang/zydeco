name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Check format
      run: cargo fmt -- --check

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Lint
      run: cargo clippy-all -- -D warnings

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - uses: Swatinem/rust-cache@v2
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm binutils
    - name: Run Tests
      run: cargo test-all --verbose
    - name: Run Doc Tests
      run: cargo test-doc-all --verbose

  tree-sitter:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: editor/tree-sitter-zydeco

    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
      with:
        version: 11.9.0
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: editor/tree-sitter-zydeco/pnpm-lock.yaml
    - name: Install Tree-sitter tooling
      run: pnpm install --frozen-lockfile
    - name: Check grammar, queries, and source corpus
      run: pnpm check
    - name: Check generated parser is current
      run: git diff --exit-code -- src
