name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm binutils
    - name: Check format
      run: cargo fmt -- --check
    - name: Build
      run: cargo build-all --verbose
    - name: Run Tests
      run: cargo test-all --verbose
    - name: Run Doc Tests
      run: cargo test-doc-all --verbose

  tree-sitter:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: editor/tree-sitter-zydeco

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 11.9.0
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: editor/tree-sitter-zydeco/pnpm-lock.yaml
    - name: Install Tree-sitter tooling
      run: pnpm install --frozen-lockfile
    - name: Check grammar, queries, and source corpus
      run: pnpm check
    - name: Check generated parser is current
      run: git diff --exit-code -- src
