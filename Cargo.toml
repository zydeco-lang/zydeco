[workspace]
resolver = "3"
members = [
    "lang/foundation",
    "lang/derive",
    "lang/machine",
    "lang/syntax",
    "lang/surface",
    "lang/fmt",
    "lang/statics",
    "lang/ir",
    "lang/dynamics",
    "lang/stackir",
    "lang/assembly",
    "lang/amd64",
    "lang/wasm-common",
    "lang/wasm-sps",
    "lang/session",
    "lang/tests",
    "tui",
    "cli",
    "editor/cajun",
    "xtask",
]
exclude = ["build"]

[workspace.package]
version = "0.3.0"
rust-version = "1.97"
edition = "2024"
# homepage = "https://zydeco-lang.github.io"
repository = "https://github.com/zydeco-lang/zydeco"
license = "MIT"
readme = "README.md"

[workspace.lints.clippy]
# `debug_assert!` + side effect = disaster in production
debug_assert_with_mut_call = "warn"
# Function-length budget; the threshold lives in `clippy.toml`.
too_many_lines = "warn"

[workspace.dependencies]
# zydeco
zydeco-foundation = { path = "lang/foundation" }
zydeco-derive = { path = "lang/derive" }
zydeco-machine = { path = "lang/machine" }
zydeco-syntax = { path = "lang/syntax" }
zydeco-surface = { path = "lang/surface" }
zydeco-fmt = { path = "lang/fmt" }
zydeco-statics = { path = "lang/statics" }
zydeco-ir = { path = "lang/ir" }
zydeco-dynamics = { path = "lang/dynamics" }
zydeco-amd64 = { path = "lang/amd64" }
zydeco-wasm-common = { path = "lang/wasm-common" }
zydeco-wasm-sps = { path = "lang/wasm-sps" }
zydeco-assembly = { path = "lang/assembly" }
zydeco-stackir = { path = "lang/stackir" }
zydeco-session = { path = "lang/session" }
zydeco-tui = { path = "tui" }
zydeco-cli = { path = "cli" }
# meta
proc-macro2 = "1.0"
syn = "3.0.4"
quote = "1.0"
# derive
derive_more = { version = "2.1" }
impl-tools = "0.13"
auto_impl = "1.3"
strum = { version = "0.28", features = ["derive"] }
# utils
stacker = "0.1"
rand = "0.10"
tempfile = "3.27"
libtest-mimic = "0.8"
walkdir = "2"
libffi = "5"
# data structures
la-arena = "0.3.1"
rpds = "1.2.1"
indexmap = "2.14"
rustc-hash = "2.1"
dashmap = "6.2"
# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = "0.25"
wasm-encoder = { version = "0.259.0", default-features = false }
wasmparser = { version = "0.259.0", default-features = false, features = [
    "prefer-btree-collections",
    "std",
    "validate",
] }
# parallelism
salsa = "0.28.2"
# error handling
thiserror = "2"
ariadne = { version = "0.6", features = ["auto-color"] }
# parsing
regex = "1"
sha3 = "0.12"
logos = "0.16"
lalrpop = "0.23"
lalrpop-util = "0.23"
# pretty printing
pretty = { version = "0.12", features = ["termcolor"] }
# cli
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# async
tokio = { version = "1.53", features = ["full"] }
# lsp
tower-lsp = { version = "0.20", features = ["proposed"] }

# Line tables keep backtrace line numbers without full variable debuginfo,
# cutting the size of deps/ and incremental/ artifacts.
[profile.dev]
debug = "line-tables-only"

# Named dev/test package overrides live in .cargo/config.toml.
# Only generic profile settings belong here.

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
# codegen-units = 1
