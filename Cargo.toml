[workspace]
resolver = "3"
members = [
    "lang/utils",
    "lang/derive",
    "lang/syntax",
    "lang/surface",
    "lang/statics",
    "lang/dynamics",
    "lang/stackir",
    "lang/assembly",
    "lang/amd64",
    "lang/wasm-common",
    "lang/wasm-am",
    "lang/wasm-sps",
    "lang/session",
    "lang/tests",
    "tui",
    "cli",
    # "web",
    "editor/cajun",
]
exclude = ["build"]

[workspace.package]
version = "0.3.0"
rust-version = "1.97"
authors = ["The Zydeco Project Developers"]
edition = "2024"
# homepage = "https://zydeco-lang.github.io"
repository = "https://github.com/zydeco-lang/zydeco"
license = "MIT"
readme = "README.md"

[workspace.lints.clippy]
# `debug_assert!` is compiled out under release profiles, so a mutating call in
# its argument changes behavior between debug and release builds.
debug_assert_with_mut_call = "warn"

[workspace.dependencies]
# zydeco
zydeco-utils = { path = "lang/utils" }
zydeco-derive = { path = "lang/derive" }
zydeco-syntax = { path = "lang/syntax" }
zydeco-surface = { path = "lang/surface" }
zydeco-statics = { path = "lang/statics" }
zydeco-dynamics = { path = "lang/dynamics" }
zydeco-amd64 = { path = "lang/amd64" }
zydeco-wasm-common = { path = "lang/wasm-common" }
zydeco-wasm-am = { path = "lang/wasm-am" }
zydeco-wasm-sps = { path = "lang/wasm-sps" }
zydeco-assembly = { path = "lang/assembly" }
zydeco-stackir = { path = "lang/stackir" }
zydeco-session = { path = "lang/session" }
zydeco-tui = { path = "tui" }
# meta
proc-macro2 = "1.0"
syn = "3.0.4"
quote = "1.0"
# derive
derive_more = { version = "2.1" }
impl-tools = "0.13"
auto_impl = "1.3"
strum = { version = "0.28", features = ["derive"] }
# utils
rand = "0.10"
pretty_assertions = "1.4"
tempfile = "3.27"
libffi = "5"
# data structures
la-arena = "0.3.1"
sequence_trie = "0.3"
rpds = "1.2.1"
indexmap = "2.14"
phf = "0.14"
rustc-hash = "2.1"
dashmap = "6.2"
# serialization
serde = { version = "1.0", features = ["derive"] }
serde_plain = "1.0"
serde_json = "1.0"
toml = "1.1"
toml_edit = "0.25"
wasm-encoder = { version = "0.258.0", default-features = false }
wasmparser = { version = "0.258.0", default-features = false, features = [
    "prefer-btree-collections",
    "std",
    "validate",
] }
# parallelism
salsa = "0.28.2"
# error handling
thiserror = "2"
unindent = "0.2"
ariadne = { version = "0.6", features = ["auto-color"] }
# parsing
regex = "1"
logos = "0.16"
lalrpop = "0.23"
lalrpop-util = "0.23"
# pretty printing
pretty = { version = "0.12", features = ["termcolor"] }
# cli
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# async
tokio = { version = "1.53", features = ["full"] }
# web
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlTextAreaElement",
    "MouseEvent",
    "Node",
    "Window",
] }
# lsp
tower-lsp = { version = "0.20", features = ["proposed"] }

# Line tables keep backtrace line numbers without full variable debuginfo,
# cutting the size of deps/ and incremental/ artifacts.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.zydeco-statics]
opt-level = 1
incremental = false

[profile.dev.package.zydeco-surface]
opt-level = 1

# Deeply nested programs exercise recursive surface, static, and assembly passes;
# optimizing these crates keeps their test stack frames small
# without changing the whole profile.
[profile.test.package.zydeco-statics]
opt-level = 1
incremental = false

[profile.test.package.zydeco-surface]
opt-level = 1

[profile.test.package.zydeco-assembly]
opt-level = 1

[profile.release]
lto = "thin"
# codegen-units = 1
