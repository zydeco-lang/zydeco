[env]
# Raised for residual programs produced by static composition; see docs/proposals/value-pi.md.
# Factoring repeated residual code into direct blocks remains a backend optimization.
RUST_MIN_STACK = "16777216"

[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

[alias]
check-all = "check --all --all-targets"
build-all = "build --all --all-targets"
test-all = "test --all --all-targets"
test-all-low = "test --all --all-targets -- --test-threads=2"
test-doc-all = "test --all --doc"
clippy-all = "clippy --all --all-targets"
clippy-fix-all = "clippy --all --all-targets --fix"
doc-all = "doc --all --all-targets"

# Keep named dev/test package overrides in configuration: Cargo permits unmatched
# packages here when `cargo install --path` resolves only one package's dependencies.
# Git installs ignore this file; broad defaults and release settings stay in Cargo.toml.

[profile.dev.package.zydeco-statics]
opt-level = 1
incremental = false

[profile.dev.package.zydeco-surface]
opt-level = 1

# Incremental sessions fork per unit fingerprint, so any upstream edit strands
# fresh sessions for every downstream crate. Crates whose own edit rate is low
# never earn that disk back through same-crate reuse.
[profile.dev.package.zydeco-session]
incremental = false

[profile.dev.package.zydeco-stackir]
incremental = false

[profile.dev.package.zydeco-assembly]
incremental = false

[profile.dev.package.zydeco-dynamics]
incremental = false

[profile.dev.package.zydeco-amd64]
incremental = false

[profile.dev.package.zydeco-cli]
incremental = false

[profile.dev.package.zydeco-tui]
incremental = false

[profile.dev.package.cajun]
incremental = false

# Deeply nested programs exercise recursive surface, static, and assembly passes;
# optimizing these crates keeps their test stack frames small
# without changing the whole profile.
[profile.test.package.zydeco-statics]
opt-level = 1
incremental = false

[profile.test.package.zydeco-surface]
opt-level = 1

[profile.test.package.zydeco-assembly]
opt-level = 1
incremental = false

[profile.test.package.zydeco-session]
incremental = false

[profile.test.package.zydeco-stackir]
incremental = false

[profile.test.package.zydeco-dynamics]
incremental = false

[profile.test.package.zydeco-amd64]
incremental = false

[profile.test.package.zydeco-cli]
incremental = false

[profile.test.package.zydeco-tui]
incremental = false

[profile.test.package.cajun]
incremental = false
