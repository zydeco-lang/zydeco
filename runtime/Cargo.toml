[package]
name = "zydeco-runtime"
version = "0.0.0"
edition = "2024"
build = "build.rs"

[workspace]

[features]
# Experimental storage engine; generated actions and preservation proofs agree
# with the default retained-frame engine through the shared Environment contract.
compact-environments = []

[workspace.dependencies]
zydeco-machine = { path = "../lang/machine", features = ["runtime"] }
rand = "0.10"

[[bin]]
name = "main"
path = "stub.rs"

[dependencies]
zydeco-machine = { workspace = true }
rand = { workspace = true }

# LLVM's local ThinLTO can discard the undecorated exports referenced only by
# generated assembly. Keep them visible to the native linker in optimized builds.
# `false` still permits local ThinLTO; `off` disables it as well.
[profile.dev]
lto = "off"

[profile.release]
lto = "off"
