[book]
title = "Zydeco Compiler Implementation Reference"
description = "Compiler architecture, intermediate representations, checking, lowering, runtimes, tooling, and validation for Zydeco."
language = "en"
src = "src"

[build]
build-dir = "../../../target/book/compiler"
create-missing = false

[preprocessor.repo-links]
command = "python3 ../../scripts/mdbook-repo-links.py"
renderers = ["html"]

[output.html]
no-section-label = true
git-repository-url = "https://github.com/zydeco-lang/zydeco"
edit-url-template = "https://github.com/zydeco-lang/zydeco/edit/main/docs/references/compiler/{path}"
additional-js = ["theme/home-link.js", "theme/zydeco-hljs.js", "theme/mermaid-init.js"]
