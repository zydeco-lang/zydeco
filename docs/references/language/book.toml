[book]
title = "Zydeco Language Reference"
description = "Source language rules, static semantics, packages, capabilities, and execution profiles for Zydeco."
language = "en"
src = "src"

[build]
build-dir = "../../../target/book/language"
create-missing = false

[preprocessor.repo-links]
command = "python3 ../../scripts/mdbook-repo-links.py"
renderers = ["html"]

[output.html]
git-repository-url = "https://github.com/zydeco-lang/zydeco"
edit-url-template = "https://github.com/zydeco-lang/zydeco/edit/main/docs/references/language/{path}"
additional-js = ["theme/zydeco-hljs.js", "theme/mermaid-init.js"]
